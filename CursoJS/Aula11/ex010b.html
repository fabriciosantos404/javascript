<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade</title>
</head>
<body>
    <h1>Teste de Nacionalidade</h1>
    Selecione seu país: <input type="text" name="txtp" id="txtp">
    <input type="button" value="Verificar" onclick="resultado()">
    <div id="res"></div>
    <script>
        function resultado(){
            var pais = window.document.querySelector('input#txtp').value
            var res = window.document.querySelector('div#res')

            if(pais == 'Brasil'){
                res.innerHTML = `Você é Brasileiro!`
            } else if (pais == 'EUA'){
                    res.innerHTML = `Você é dos EUA`
                } else {
                    res.innerHTML = `Você é Francês!`
                }
        }
    </script>
</body>
</html>
